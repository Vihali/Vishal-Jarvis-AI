name: Vishal Jarvis Android Build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested APK to GitHub Releases
        type: boolean
        default: false
  push:
    paths:
      - 'app-source/**'
      - '.github/workflows/android-build.yml'
      - 'tools/**'
  pull_request:
    paths:
      - 'app-source/**'
      - '.github/workflows/android-build.yml'
      - 'tools/**'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-web:
    name: Typecheck and test the existing interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-source/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Check source archive safety and reproducibility
        run: python ../tools/test-package-source.py

  build:
    name: Build and verify Vishal Jarvis APK
    needs: verify-web
    runs-on: windows-2025
    outputs:
      apk_name: ${{ steps.stage.outputs.apk_name }}
      signing: ${{ steps.signing.outputs.mode }}
      compatible: ${{ steps.verify.outputs.compatible }}
    defaults:
      run:
        working-directory: app-source
    steps:
      - name: Checkout existing application
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-source/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''
      - name: Install Android SDK 35
        shell: pwsh
        run: |
          $sdkmanager = (Get-Command sdkmanager.bat -ErrorAction Stop).Source
          @('y') * 30 | & $sdkmanager --licenses
          if ($LASTEXITCODE -ne 0) { throw 'SDK license acceptance failed.' }
          & $sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed.' }
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: app-source/android/local-debug.keystore
          key: vishal-jarvis-debug-keystore-v1
      - name: Prepare web assets and icon
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Web checks failed.' }
          node --import tsx scripts/export-mobile-personality.ts
          if ($LASTEXITCODE -ne 0) { throw 'Personality export failed.' }
          pwsh -NoProfile -File scripts/ensure-build-icons.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed.' }
          New-Item -ItemType Directory -Force android/app/src/main/res/drawable | Out-Null
          Copy-Item -Force build/icon.png android/app/src/main/res/drawable/vishal_jarvis_icon.png
      - name: Prepare signing (secrets or clearly labelled debug)
        id: signing
        shell: pwsh
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if (!(Test-Path android/local-debug.keystore)) {
            & "$env:JAVA_HOME/bin/keytool.exe" -genkeypair -keystore android/local-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Vishal Jarvis Local Development,O=Vishal,C=IN'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create development key.' }
          }
          $values = @($env:RELEASE_KEYSTORE_BASE64, $env:RELEASE_STORE_PASSWORD, $env:RELEASE_KEY_ALIAS, $env:RELEASE_KEY_PASSWORD)
          $provided = @($values | Where-Object { ![string]::IsNullOrWhiteSpace($_) }).Count
          if ($provided -eq 0) {
            'mode=debug' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'No release credentials configured: producing a labelled debug APK.'
          } elseif ($provided -ne 4) {
            throw 'Release signing is incomplete. Configure all four ANDROID_SIGNING_* secrets or remove all four.'
          } else {
            $store = Join-Path $env:RUNNER_TEMP 'vishal-release.jks'
            [IO.File]::WriteAllBytes($store, [Convert]::FromBase64String($env:RELEASE_KEYSTORE_BASE64))
            "ANDROID_SIGNING_STORE_FILE=$store" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "ANDROID_SIGNING_STORE_PASSWORD=$env:RELEASE_STORE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "ANDROID_SIGNING_KEY_ALIAS=$env:RELEASE_KEY_ALIAS" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "ANDROID_SIGNING_KEY_PASSWORD=$env:RELEASE_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            'mode=release' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - name: Compile Android and run Java unit tests
        shell: pwsh
        run: |
          gradle --no-daemon -p android :app:testDebugUnitTest :app:assembleDebug
          if ($LASTEXITCODE -ne 0) { throw 'Gradle debug build or Android unit tests failed.' }
          if ('${{ steps.signing.outputs.mode }}' -eq 'release') {
            gradle --no-daemon -p android :app:assembleRelease
            if ($LASTEXITCODE -ne 0) { throw 'Gradle release build failed.' }
          }
      - name: Build instrumentation APK with the same debug certificate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/android | Out-Null
          pwsh -NoProfile -File scripts/build-android-tests.ps1 -SdkRoot $env:ANDROID_HOME -JavaRoot $env:JAVA_HOME
          if ($LASTEXITCODE -ne 0) { throw 'Instrumentation APK build failed.' }
      - name: Stage APKs
        id: stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/android | Out-Null
          $debug = 'Vishal-Jarvis-1.5.0-debug.apk'
          Copy-Item android/app/build/outputs/apk/debug/app-debug.apk "artifacts/android/$debug" -Force
          if ('${{ steps.signing.outputs.mode }}' -eq 'release') {
            $name = 'Vishal-Jarvis-1.5.0-release.apk'
            Copy-Item android/app/build/outputs/apk/release/app-release.apk "artifacts/android/$name" -Force
          } else { $name = $debug }
          "apk_name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Verify signature, identity and previous-certificate compatibility
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $tools = Join-Path $env:ANDROID_HOME 'build-tools/35.0.0'
          $apk = Join-Path (Get-Location) 'artifacts/android/${{ steps.stage.outputs.apk_name }}'
          if (!(Test-Path $apk)) { throw 'APK not generated.' }
          $signature = & (Join-Path $tools 'apksigner.bat') verify --verbose --print-certs $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed.' }
          $signature | Write-Host
          $badging = & (Join-Path $tools 'aapt2.exe') dump badging $apk
          if ($LASTEXITCODE -ne 0 -or !($badging -match "package: name='com.myraa.mobile' versionCode='10'")) { throw 'Unexpected APK package or version.' }
          $badging | Select-Object -First 12 | Write-Host
          Get-FileHash -LiteralPath $apk -Algorithm SHA256
          $previous = Join-Path $env:RUNNER_TEMP 'previous-apk'
          New-Item -ItemType Directory -Force $previous | Out-Null
          gh release download v1.3.0 --repo $env:REPOSITORY --pattern '*.apk' --dir $previous
          $compatible = 'unknown'
          if ($LASTEXITCODE -eq 0) {
            $old = Get-ChildItem $previous -Filter '*.apk' | Select-Object -First 1
            $prior = & (Join-Path $tools 'apksigner.bat') verify --print-certs $old.FullName
            if ($LASTEXITCODE -eq 0) {
              $newHash = ($signature | Select-String 'certificate SHA-256 digest:' | Select-Object -First 1).ToString().Split(':')[-1].Trim()
              $oldHash = ($prior | Select-String 'certificate SHA-256 digest:' | Select-Object -First 1).ToString().Split(':')[-1].Trim()
              $compatible = if ($newHash -eq $oldHash) { 'yes' } else { 'no' }
              Write-Host "Compatible with v1.3.0 signature: $compatible"
            }
          }
          "compatible=$compatible" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "::notice title=APK verification::Signing mode: ${{ steps.signing.outputs.mode }}; v1.3.0 certificate match: $compatible"
          if ($compatible -ne 'yes') {
            Write-Host '::warning title=Android update compatibility::Back up/export data first. If the previous certificate does not match, Android requires uninstalling the old app, which deletes its local data.'
          }
          @(
            '### APK verification',
            '- Package: `com.myraa.mobile`',
            '- Version: `1.5.0` (10)',
            '- Signing: `${{ steps.signing.outputs.mode }}`',
            "- Certificate match with v1.3.0: ``$compatible``",
            "- APK SHA-256: ``$((Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLower())``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-APK
          path: app-source/artifacts/android/${{ steps.stage.outputs.apk_name }}
          if-no-files-found: error
      - name: Upload debug APK and instrumentation for Android testing
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-Android-Tests
          path: |
            app-source/artifacts/android/Vishal-Jarvis-1.5.0-debug.apk
            app-source/artifacts/android/Vishal-Jarvis-tests.apk
          if-no-files-found: error
      - name: Package the existing app source
        shell: pwsh
        run: |
          python ../tools/package-source.py --output "$env:RUNNER_TEMP/Vishal-Jarvis-Android-App-Source.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Source packaging failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-Source
          path: ${{ runner.temp }}/Vishal-Jarvis-Android-App-Source.zip
          if-no-files-found: error
      - name: Delete temporary release signing key
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP/vishal-release.jks"

  android-tests:
    name: Android emulator background and UI tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # The script time-boxes every phase itself, so a hung WebView or Activity
      # fails with an annotation instead of silently consuming the job limit.
      EMULATOR_LOG_DIR: /tmp/emulator
      EMULATOR_TEST_BUDGET: '1500'
      EMULATOR_TEST_TIMEOUT: '600'
      EMULATOR_BOOT_TIMEOUT: '420'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Vishal-Jarvis-Android-Tests
          path: test-apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise installed APK and background recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash app-source/scripts/run-emulator-tests.sh test-apks
      - name: Attach emulator logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-Emulator-Results
          path: |
            /tmp/emulator/
            /tmp/*Instrumentation.log
          if-no-files-found: ignore
      - name: Summarize any emulator test failure
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          files=(/tmp/emulator/*.log /tmp/emulator/logcat.txt /tmp/*Instrumentation.log)
          if (( ${#files[@]} == 0 )); then
            echo '::error title=Emulator tests::The emulator step ended before any test log was written. Check the emulator boot output in the step log.'
            exit 0
          fi
          for file in "${files[@]}"; do
            if grep -qE 'FAIL:|BACKGROUND_TESTS_FAILED|TIMEOUT after' "$file" || ! grep -q 'INSTRUMENTATION_CODE: -1' "$file"; then
              message=$(tail -c 4000 "$file")
              message=${message//'%'/'%25'}
              message=${message//$'\n'/'%0A'}
              message=${message//$'\r'/'%0D'}
              echo "::error title=$(basename "$file")::$message"
            fi
          done

  release:
    name: Publish the verified APK to GitHub Releases
    needs: [build, android-tests]
    if: >-
      github.event_name != 'pull_request' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-apk]')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Vishal-Jarvis-APK
          path: dist
      - name: Publish APK and make it latest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          SIGNING: ${{ needs.build.outputs.signing }}
          COMPATIBLE: ${{ needs.build.outputs.compatible }}
        run: |
          set -euo pipefail
          test -s "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME"
          cat > release-notes.md <<EOF_NOTES
          Vishal Jarvis for Android **1.5.0**, built from the existing app.

          - Existing 3D character, interface, voice, device actions, settings and conversation history are retained.
          - Submitted text tasks are saved on the phone, run with a foreground notification when eligible, and are retried by Android's network-constrained persistent scheduler. Completion notifications open the saved answer.
          - Time-sensitive research uses Gemini's Google Search grounding when the selected model/project supports it. Search sources are included when returned.
          - Gemini/internet diagnostics, searchable conversations, shareable/saveable text transcripts, dark/light themes and adjustable text size.
          - No automatic SIM-access permission request. Existing Phone, SMS, Contacts and other feature permissions remain separate.

          **Signing:** $SIGNING. Signature match to the 1.3.0 APK: $COMPATIBLE. If it does not match, Android cannot install this APK as an update over the old one. Back up/export your data before uninstalling the old app; uninstalling removes its local data. A debug APK is for private testing, not a Play Store release.

          **Background limits:** Android can defer jobs during Doze, battery restrictions, force-stop or until first unlock after reboot. Notification permission is needed for visible completion notifications. The device cannot process tasks while powered off; this app has no server-side worker. Phone actions requiring a visible UI are not silently repeated or performed in the background.

          **Install:** Download the APK below on your phone, allow installation from your browser when Android asks, and open it. Requires Android 8+, WebView 100+, OpenGL ES 3, internet, and your own Gemini API key.

          Direct download: https://github.com/$REPO/releases/download/v1.5.0/$APK_NAME
          EOF_NOTES
          if gh release view v1.5.0 --repo "$REPO" >/dev/null 2>&1; then
            gh release edit v1.5.0 --repo "$REPO" --title 'Vishal Jarvis for Android 1.5.0' --notes-file release-notes.md --latest
          else
            gh release create v1.5.0 --repo "$REPO" --target "$GITHUB_SHA" --title 'Vishal Jarvis for Android 1.5.0' --notes-file release-notes.md --latest
          fi
          gh release upload v1.5.0 "dist/$APK_NAME" --repo "$REPO" --clobber
          gh release view v1.5.0 --repo "$REPO" --json url,assets --jq '{url, assets: [.assets[].url]}'
