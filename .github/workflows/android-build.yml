
name: Vishal Jarvis Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Vishal-Jarvis-Android-App-Source.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Vishal Jarvis APK
    runs-on: windows-2025

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK Licenses
        shell: pwsh
        run: |
          $sdkmanager = (Get-Command sdkmanager.bat -ErrorAction Stop).Source
          $answers = @('y') * 30
          $answers | & $sdkmanager --licenses

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK license acceptance failed."
          }

      - name: Install Android SDK Components
        shell: pwsh
        run: |
          $sdkmanager = (Get-Command sdkmanager.bat -ErrorAction Stop).Source

          & $sdkmanager "platforms;android-35" "build-tools;35.0.0"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK installation failed."
          }

      - name: Extract Android Source ZIP
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "Vishal-Jarvis-Android-App-Source.zip"

          if (!(Test-Path $zip)) {
            throw "Source ZIP not found in repository root."
          }

          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force

          $source = Join-Path $env:RUNNER_TEMP "Vishal-Jarvis-Android-App-Source"

          if (!(Test-Path "$source/package.json")) {
            throw "package.json not found inside source ZIP."
          }

          if (!(Test-Path "$source/scripts/build-android.ps1")) {
            throw "Android build script not found inside source ZIP."
          }

          "SOURCE_DIR=$source" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Project Dependencies
        shell: pwsh
        run: |
          Set-Location $env:SOURCE_DIR
          npm install

          if ($LASTEXITCODE -ne 0) {
            throw "npm install failed."
          }

      - name: Test mobile commands and manifest
        shell: pwsh
        run: |
          Set-Location $env:SOURCE_DIR
          node --import tsx "$env:GITHUB_WORKSPACE/tests/mobile-actions.test.mjs"
          if ($LASTEXITCODE -ne 0) { throw "Mobile command or manifest tests failed." }

      - name: Build Android APK
        shell: pwsh
        run: |
          Set-Location $env:SOURCE_DIR
          pwsh -NoProfile -File scripts/build-android.ps1

          if ($LASTEXITCODE -ne 0) {
            throw "Android APK build failed."
          }

      - name: Build instrumentation test APK
        shell: pwsh
        run: |
          Set-Location $env:SOURCE_DIR
          pwsh -NoProfile -File scripts/build-android-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Instrumentation APK build failed." }

      - name: Verify APK
        shell: pwsh
        run: |
          $apk = Join-Path $env:SOURCE_DIR "artifacts/android/Vishal-Jarvis-1.1.0-private.apk"

          if (!(Test-Path $apk)) {
            throw "APK file was not generated."
          }

          Write-Host "APK successfully generated: $apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-debug-APK
          path: ${{ runner.temp }}/Vishal-Jarvis-Android-App-Source/artifacts/android/Vishal-Jarvis-1.1.0-private.apk
          if-no-files-found: error

      - name: Upload instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-instrumentation-APK
          path: ${{ runner.temp }}/Vishal-Jarvis-Android-App-Source/artifacts/android/Vishal-Jarvis-tests.apk
          if-no-files-found: error

  emulator-tests:
    name: Install and test APK on Android emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: Vishal-Jarvis-debug-APK
          path: apk
      - name: Download instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: Vishal-Jarvis-instrumentation-APK
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APKs and run instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            set -eu
            adb install -r apk/Vishal-Jarvis-1.1.0-private.apk
            adb install -r apk/Vishal-Jarvis-tests.apk
            for test in SmokeInstrumentation AuthInstrumentation ActionsInstrumentation; do
              echo "Running $test"
              output=$(timeout 300 adb shell am instrument -w "com.myraa.mobile.tests/com.myraa.mobile.tests.$test" 2>&1) || { echo "::error::Instrumentation command failed for $test"; exit 1; }
              printf '%s\n' "$output"
              if ! printf '%s\n' "$output" | grep -q 'INSTRUMENTATION_CODE: -1' || printf '%s\n' "$output" | grep -qE 'FAIL:|INSTRUMENTATION_FAILED|Process crashed'; then
                echo "::error::Instrumentation $test failed: $(printf '%s\n' "$output" | tail -12 | tr '\n' ' ')"
                exit 1
              fi
            done
