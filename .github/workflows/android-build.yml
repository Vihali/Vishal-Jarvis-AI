name: Vishal Jarvis Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'app-source/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'app-source/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  verify-web:
    name: Typecheck and build web assets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app-source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run parser and tool-schema tests
        run: npm test

      - name: Build bundled mobile assets
        run: npm run build:mobile-assets

      - name: Upload web assets
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-web-assets
          path: app-source/android/app/src/main/assets
          if-no-files-found: error

  build:
    name: Build Vishal Jarvis APK
    needs: verify-web
    runs-on: windows-2025
    defaults:
      run:
        working-directory: app-source

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app-source/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK Licenses
        shell: pwsh
        run: |
          $sdkmanager = (Get-Command sdkmanager.bat -ErrorAction Stop).Source
          $answers = @('y') * 30
          $answers | & $sdkmanager --licenses

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK license acceptance failed."
          }

      - name: Install Android SDK Components
        shell: pwsh
        run: |
          $sdkmanager = (Get-Command sdkmanager.bat -ErrorAction Stop).Source

          & $sdkmanager "platforms;android-35" "build-tools;35.0.0"

          if ($LASTEXITCODE -ne 0) {
            throw "Android SDK installation failed."
          }

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: app-source/android/local-debug.keystore
          key: vishal-jarvis-debug-keystore-v1

      - name: Install Project Dependencies
        shell: pwsh
        run: |
          npm ci

          if ($LASTEXITCODE -ne 0) {
            throw "npm ci failed."
          }

      - name: Typecheck, test and bundle assets
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "TypeScript typecheck failed." }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Parser tests failed." }
          npm run build:mobile-assets
          if ($LASTEXITCODE -ne 0) { throw "Mobile asset build failed." }

      - name: Build Android APK
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/build-android.ps1 -SdkRoot $env:ANDROID_HOME -JavaRoot $env:JAVA_HOME 2>&1 | Tee-Object -FilePath build-output.log

          if ($LASTEXITCODE -ne 0) {
            # Surface the real compiler/tool error as a check annotation and keep the log.
            $tail = ((Get-Content build-output.log -Tail 40 -ErrorAction SilentlyContinue) -join "`n").Replace("`r", "").Replace("`n", "%0A")
            Write-Host "::error title=Android build failed::$tail"
            throw "Android APK build failed."
          }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-build-log
          path: app-source/build-output.log
          if-no-files-found: ignore

      - name: Verify APK
        shell: pwsh
        run: |
          $apk = Join-Path (Get-Location) "artifacts/android/Vishal-Jarvis-1.3.0-private.apk"

          if (!(Test-Path $apk)) {
            throw "APK file was not generated."
          }

          Write-Host "APK successfully generated: $apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-APK
          path: app-source/artifacts/android/Vishal-Jarvis-1.3.0-private.apk
          if-no-files-found: error

      - name: Package source ZIP
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "Vishal-Jarvis-Android-App-Source.zip"
          Remove-Item -LiteralPath $zip -ErrorAction SilentlyContinue

          # bsdtar creates a zip without node_modules or build output.
          tar.exe -a -c -f $zip --exclude=node_modules --exclude=android/app/build `
            --exclude=android/app/src/main/assets --exclude=artifacts `
            --exclude=android/local-debug.keystore -C $env:GITHUB_WORKSPACE app-source

          if ($LASTEXITCODE -ne 0) {
            throw "Source packaging failed."
          }

          Write-Host "Source package: $zip"

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-Source
          path: Vishal-Jarvis-Android-App-Source.zip
          if-no-files-found: error

  release:
    name: Publish APK to GitHub Releases
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built APK
        uses: actions/download-artifact@v4
        with:
          name: Vishal-Jarvis-APK
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: v1.3.0
        run: |
          set -euo pipefail
          APK_PATH=$(find dist -type f -name '*.apk' -print -quit)
          if [ -z "$APK_PATH" ]; then echo "No APK in the build artifact"; exit 1; fi
          APK_NAME=$(basename "$APK_PATH")
          echo "Publishing $APK_NAME"

          cat > release-notes.md <<EOF
          Vishal Jarvis for Android **1.3.0** — the agent now finishes the job itself.

          ### Direct calling
          - The agent **places the call**, not just the dialer. "রাহুল কে কল করো" or "call +91…" starts the call immediately.
          - **Dual-SIM:** when the phone has more than one SIM, the agent asks which one ("SIM 1 Airtel, SIM 2 Jio — which?") and then calls from that SIM. It never guesses.
          - Needs the **Phone** permission; the SIM list needs phone state access.
          - It reports `call_started`, which means Android began dialling — not that the other side answered.

          ### Direct sending
          - WhatsApp, **Telegram, Instagram, Messenger and SMS** — the agent opens the exact chat, writes your text and **presses Send**.
          - Two steps, always: the agent repeats the recipient and the exact text, you say "send", and only then does it send. "cancel" discards it.
          - Direct sending in chat apps uses an **Accessibility service** ("Vishal Jarvis message sender") that you enable yourself in Android Settings → Accessibility. It is scoped to WhatsApp, WhatsApp Business, Telegram, Instagram and Messenger; nothing else on your phone is readable through it.
          - Statuses are honest: `sent` (composer emptied after Send), `sent_unverified` (Send pressed, confirmation not readable), `sms_queued` / `sms_delivered_to_network` (Android accepted the SMS), `failed`, `permission_required`.

          ### Everything from 1.2.0 is still here
          - Typed chat acts on your phone through Gemini function calling (up to four steps per request), live voice shares the same tools.
          - 22 actions: open apps, https links, YouTube/web search, calls, messages, SIM info, flashlight, Wi-Fi and 13 system panels, alarms, timers, calendar, Maps, share sheet, clipboard, media keys, volume, device status, app list, camera.
          - Long-term memory (max 30 short facts), streaming replies, permission manager, light/dark themes.
          - Still no screen capture, no notification reading, no file access, and no silent background sending.

          ### Direct APK download
          https://github.com/$REPO/releases/download/$TAG/$APK_NAME

          ### Install
          1. Open the link above on your phone and download the APK.
          2. Allow "Install unknown apps" for your browser or file manager when Android asks.
          3. Open the file and install.
          4. Launch **Vishal Jarvis**, then Settings → paste your own Gemini API key.

          If an older Vishal Jarvis build is already installed, uninstall it first — testing builds use a local debug signature, so Android may refuse an update over a different key.

          ### Requirements
          Android 8.0 (API 26) or newer, Android System WebView 100+, OpenGL ES 3, internet, and your own Gemini API key with access to the chosen model.

          This is a private testing build signed with a local development key, not a Play Store release. CI compiled it from \`app-source/\`; startup, 3D rendering, permissions and each device action still need verification on your own phone.
          EOF

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --title "Vishal Jarvis for Android 1.3.0" --notes-file release-notes.md
          else
            gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" \
              --title "Vishal Jarvis for Android 1.3.0" --notes-file release-notes.md --latest
          fi

          gh release upload "$TAG" "$APK_PATH" --repo "$REPO" --clobber
          gh release view "$TAG" --repo "$REPO" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
